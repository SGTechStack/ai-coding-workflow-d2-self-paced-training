  # S28 · slide · D5 process-flow (5 cards)
  # Title states the takeaway rather than the acronym: a bare acronym is a topic
  # label and leaves the body with no claim to prove. The acronym itself is
  # spoken in the narration, where it costs nothing.
  # `Implement` also loses its `text:`. It was the only card carrying body copy,
  # which made it the heaviest card while process-flow's dominant slot is card 0
  # — so the arrangement pointed at `Questions` while the weight sat on the last
  # node. The claim it carried is now the title, so removing it fixes the
  # mis-filled dominant slot and the duplication in one move. `Implement` stays
  # LAST: QRSPI is a genuine ordered sequence, and the arrow asserts exactly that.
  # Only `Questions` carries body text. process-flow's dominant slot is card 0 and
  # renders as a full-height hub, so a bare label there leaves a large empty slab
  # — a hierarchy pointing at nothing. Giving the hub the text fills it AND keeps
  # the heaviest card in the dominant slot, so the advisor stays quiet. The four
  # spokes stay labels: giving all five body text overflows the canvas by 117px,
  # which the overflow gate hard-fails (correctly).
  # `Implement` stays LAST: QRSPI is a genuine ordered sequence and the arrow
  # asserts exactly that.
  - id: s28-qrspi-slide
    type: slide
    layout: process-flow
    title: Four steps finish before any code is written
    cards:
      - { icon: circle-help, title: Questions, text: "Resolve every ambiguity here, while resolving it is still cheap." }
      - { icon: search, title: Research }
      - { icon: layers, title: Structure }
      - { icon: list-checks, title: Plan }
      - { icon: code, title: Implement }
    narration: >-
      In this workflow the practice has a name: QRSPI. The order is not the
      interesting part — the boundary is. Four steps finish completely, and only
      then does code get written. Everything ambiguous is resolved while resolving
      it is still cheap.

