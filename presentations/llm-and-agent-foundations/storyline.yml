  # are agent roles and the fourth is an execution mode — so `tiled`'s "these are
  # peers" claim would be as wrong as an undeclared spotlight. The orchestrator
  # is the root: it is the thing that spawns the others and decides what each one
  # is given, so it earns the dominant slot, and the narration now says so.
  # (`tiled` was also the riskier option here: four sentence-length cards in one
  # row is the classic overflow case, and overflow is a hard failure.)
  - id: s45-who-knows-what-slide
    type: slide
    layout: spotlight
    title: Each agent is given only what its job needs
    cards:
      - { icon: network, title: Orchestrator, weight: primary, text: Sequences work and routes blockers. Never reads files. }
      - { icon: box, title: Subagent, text: "Clean context, restricted tools, one bounded task." }
      - { icon: user-check, title: Reviewer, text: "Sees the output and the specification, nothing else." }
      - { icon: zap, title: In parallel, text: "Independent tasks run at once, on models suited to each." }
    # Narration states the rule once and gestures at all four cards — including
    # the parallel-execution card the previous version never named — instead of
    # reciting three of the four card texts back at the viewer.
    narration: >-
      Every rule in this topic is one rule, applied four times: control what each
      agent is allowed to know. It starts with the orchestrator, because it decides
      what everyone else is given. The plan, the single task, the specification,
      and the work running in parallel each sit with exactly one agent — and never
      leak to the next.

  # --- S46 · capture · failure + practice (Orchestrator-Worker) ---
  - id: s46-orchestrator-practice
    type: capture
    url: /index.html#phase-multiagent
    setupScript: setup/capture-determinism.mjs
    roiSelector: '.concept:has-text("Orchestrator-Worker")'
    steps:
      - { action: scroll, delta: -363, delayMs: 600 }
      - { action: highlight, selector: '.concept-name:text-is("Orchestrator-Worker Architecture")', delayMs: 3583 }
      - { action: highlight, selector: '.concept:has(.concept-name:text-is("Orchestrator-Worker Architecture")) .concept-desc', delayMs: 3583 }
      - { action: highlight, selector: '.concept-name:text-is("Orchestrator-Worker Architecture")', delayMs: 3581 }
    assert:
      visible: ["coordinates", "implementation decisions"]
    narration: >-
      This is the same context budget from Topic 1, spent on the wrong thing. An
      orchestrator that starts reading source files trades the overview for detail, and the
      overview was its entire job. Coordination and implementation are different roles, and
      one agent cannot hold both well.

  # --- S47 · capture · anchor + mechanism (Subagents) ---
  - id: s47-subagents-anchor
    type: capture
    url: /index.html#phase-multiagent
    setupScript: setup/capture-determinism.mjs
    steps:
      - { action: scroll, delta: -275, delayMs: 600 }
      - { action: highlight, selector: '.concept-name:text-is("Subagents and Context Isolation")', delayMs: 4338 }
      - { action: highlight, selector: '.concept:has(.concept-name:text-is("Subagents and Context Isolation")) .concept-desc', delayMs: 4337 }
    assert:
      visible: ["Subagents and Context Isolation", "clean context window"]
    narration: >-
      Each subagent starts with a clean context window, a restricted tool set, and a single
      bounded task. Isolation ensures a subagent reading files for one ticket cannot pollute
      the context of another.

  # --- S48 · capture · failure + practice (Subagents) ---
  - id: s48-subagents-practice
    type: capture
    url: /index.html#phase-multiagent
    setupScript: setup/capture-determinism.mjs
    roiSelector: '.concept:has-text("Subagents and Context Isolation")'
    steps:
      - { action: scroll, delta: -275, delayMs: 600 }
      - { action: highlight, selector: '.concept-name:text-is("Subagents and Context Isolation")', delayMs: 3358 }
      - { action: highlight, selector: '.concept:has(.concept-name:text-is("Subagents and Context Isolation")) .concept-desc', delayMs: 3358 }
      - { action: highlight, selector: '.concept-name:text-is("Subagents and Context Isolation")', delayMs: 3356 }
    assert:
      visible: ["restricted tool set", "bounded task"]
    narration: >-
      Isolation is a feature, not a limitation. An agent that inherits everything receives
      coordination history, other tickets' details and unrelated decisions — and then
      reasons over all of it. Fresh context, one task, only the tools that task needs.

  # --- S49 · capture · anchor + mechanism (Independent Review) ---
  - id: s49-review-anchor
    type: capture
    url: /index.html#phase-multiagent
    setupScript: setup/capture-determinism.mjs
    steps:
      - { action: scroll, delta: -176, delayMs: 600 }
      - { action: highlight, selector: '.concept-name:text-is("Independent Review as Quality Architecture")', delayMs: 3563 }
      - { action: highlight, selector: '.concept:has(.concept-name:text-is("Independent Review as Quality Architecture")) .concept-desc', delayMs: 3563 }
      - { action: highlight, selector: '.concept-name:text-is("Independent Review as Quality Architecture")', delayMs: 3561 }
    assert:
      visible: ["Independent Review", "original specification"]
    narration: >-
      When one agent reviews another's work, the reviewer gets only the final output and the
      original specification. If it inherits the implementing agent's conversation history,
      it becomes biased by the implementer's logic and ends up reviewing the reasoning
      rather than checking whether the code meets the spec.

  # --- S50 · capture · failure + practice (Independent Review) ---
  - id: s50-review-practice
    type: capture
    url: /index.html#phase-multiagent
    setupScript: setup/capture-determinism.mjs
    roiSelector: '.concept:has-text("Independent Review")'
    steps:
      - { action: scroll, delta: -176, delayMs: 600 }
      - { action: highlight, selector: '.concept-name:text-is("Independent Review as Quality Architecture")', delayMs: 3493 }
      - { action: highlight, selector: '.concept:has(.concept-name:text-is("Independent Review as Quality Architecture")) .concept-desc', delayMs: 3493 }
      - { action: highlight, selector: '.concept-name:text-is("Independent Review as Quality Architecture")', delayMs: 3491 }
    assert:
      visible: ["final output", "meets the spec"]
    narration: >-
      This has a human parallel. Sit through someone explaining why they built it that way
      and you will find yourself agreeing with the reasoning instead of reading the code. The
      explanation is persuasive; the specification is the standard. A reviewer with a clean
      context cannot be talked round.

  # --- S51 · capture · anchor + mechanism (Parallel Execution) ---
  - id: s51-parallel-anchor
    type: capture
    url: /index.html#phase-multiagent
    setupScript: setup/capture-determinism.mjs
    steps:
      - { action: scroll, delta: -66, delayMs: 600 }
      - { action: highlight, selector: '.concept-name:text-is("Parallel Execution and Specialization")', delayMs: 3433 }
      - { action: highlight, selector: '.concept:has(.concept-name:text-is("Parallel Execution and Specialization")) .concept-desc', delayMs: 3433 }
      - { action: highlight, selector: '.concept-name:text-is("Parallel Execution and Specialization")', delayMs: 3431 }
    assert:
      visible: ["Parallel Execution", "simultaneously"]
    narration: >-
      Unlike a human team, an orchestrator can spawn multiple subagents for independent tasks
      simultaneously — five compliance checks at once, for example. Subagents can also be
      specialised, using different system prompts or cheaper models suited to their bounded
      task.

  # --- S52 · capture · failure + practice (Parallel Execution) · US spelling retained (rule 4) ---
  - id: s52-parallel-practice
    type: capture
    url: /index.html#phase-multiagent
    setupScript: setup/capture-determinism.mjs
    roiSelector: '.concept:has-text("Parallel Execution")'
    steps:
      - { action: scroll, delta: -66, delayMs: 600 }
      - { action: highlight, selector: '.concept-name:text-is("Parallel Execution and Specialization")', delayMs: 3658 }
      - { action: highlight, selector: '.concept:has(.concept-name:text-is("Parallel Execution and Specialization")) .concept-desc', delayMs: 3658 }
      - { action: highlight, selector: '.concept-name:text-is("Parallel Execution and Specialization")', delayMs: 3656 }
    assert:
      visible: ["specialized", "cheaper models"]
    narration: >-
      Two levers, and they compound. Parallelism cuts wall-clock time on anything genuinely
      independent. Specialisation routes simple bounded work to cheap fast models and saves
      the expensive reasoning for work that needs it. The judgment required is knowing which
      tasks are actually independent.

  # ══ Closing — scenes S53–S54 ══
  # S53 · tiled · 4 cards, even weight (rule 9) — plan §5 + §6.
  # SCR resolution beat (closing seam): the four topics resolved into one argument.
  - id: s53-topic-recap
    type: slide
    role: resolution
    layout: tiled
    title: What the four topics establish
    cards:
      - { icon: gauge, title: Limits, text: "The window, the memory model, and the two failure modes." }
      - { icon: wrench, title: Engineering, text: "What goes into the window, and when." }
      - { icon: shield-check, title: Discipline, text: "Specification, tests, records, and gates." }
      - { icon: network, title: Division, text: How work and context split across agents. }
    # The four cards ARE the recap, so the voice must not re-utter them. The
    # previous version restated all four at length — the harmful redundancy case,
    # and roughly four ideas in one scene at ~2.5x the 10-20s budget. The voice
    # now gives the SHAPE of the argument and hands the detail to the screen.
    narration: >-
      Four topics, one argument. First the limits you cannot wish away. Then the
      engineering that works within them. Then the discipline that makes the
      result verifiable. And last, the division of labour across agents. Read
      down the cards — that is the whole case.

  # S54 · statement · 0 cards — plan §5 + §6.
  # SCR resolution beat (closing seam): the single closing claim.
  # NOTE — this scene deliberately keeps its `narration repeats 80%` warning.
  # A `statement` slide has no cards, so its only slide text IS the title, which
  # makes the overlap threshold trivial to trip. The redundancy principle has
  # three cases, and verbatim SYNCHRONISED reinforcement of a single claim is the
  # SAFE one; the harmful case is different-but-overlapping prose competing for
  # the phonological loop. Landing the thesis in both channels at once is the
  # point of a closing statement, so the warning is accepted rather than worded
  # around. This is exactly why the check is a heuristic and not an invariant.
  - id: s54-closing-claim
    type: slide
    role: resolution
    layout: statement
    title: Structure does the work, not the model.
    narration: >-
      If one thing carries over, make it this. Nothing here depends on a better
      model. Every practice is a response to a measurable limit, every loop
      closes on a signal a machine can check, and every gate is placed where
      judgment is genuinely required. The structure does the work.
