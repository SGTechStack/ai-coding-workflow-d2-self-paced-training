presentation:
  mode: video
  title: LLM and Agent Foundations
  archetype: scr
  engine: html
  theme: light
  formats: [png, pdf, html]

video:
  aspect: landscape
  outputs: [{ aspect: landscape }]
  # Capture entries deliberately declare NO `viewport`. The skill defaults a
  # scene's viewport to the capture aspect (1920x1080 here), and compose joins
  # the per-scene clips with `concat -c copy`, which cannot rescale. An entry
  # that overrode the viewport (these all said 1440x810) therefore encoded its
  # capture at 1440x810 while the rendered slides stayed 1920x1080, and the
  # finished MP4 switched coded resolution mid-stream — the container header
  # advertised only the first one, so ffmpeg and the verify gate saw nothing
  # wrong while ordinary players mis-scaled every capture. Leaving the viewport
  # unset keeps the capture resolution tied to the output by construction.
  #
  # Capture step delays are SIZED, not guessed. Three mechanics drive them:
  #
  #   1. A screencast's length is the timestamp of its LAST FRAME, and Chromium
  #      emits frames only when the page repaints. Static hold time is therefore
  #      invisible to the capture — a trailing `wait` adds nothing at all. Only
  #      an action that repaints extends a clip.
  #   2. The per-action cost is NOT the declared delay. Measured by instrumenting
  #      page.screencast with the same options capture.mjs uses:
  #        scroll     = delayMs + 620ms   (mouse.wheel dispatch and settle)
  #        highlight  = delayMs x 2       (showOverlay BLOCKS for `duration`, so
  #                                        the overlay is visible for the FIRST
  #                                        delayMs and there is then a FORCED
  #                                        blank gap of the same length, because
  #                                        runSteps waits delayMs again)
  #        wait       = delayMs
  #        chapter card adds ~2301ms
  #      Because a clip ends at its last repaint, a TRAILING highlight costs only
  #      delayMs — its auto-hide IS that repaint. Verified against real captures:
  #      scroll(600)+highlight(20000) predicted 21220ms, measured 21271ms;
  #      scroll(600)+highlight(4000)+highlight(6000) predicted 15220ms, measured
  #      15266ms.
  #   3. planTiming() only returns `speech-fit` — the one mode where the scene
  #      duration EQUALS the visual, so the verify gate's scene-drift check reads
  #      zero — when the narration is within 7% of the visual. Beyond that it
  #      pads with a frozen frame and the pad IS the drift, so the gate fails.
  #
  # So every capture below is  ONE seating scroll + a run of `highlight` beats,
  # ending on a highlight so the clip closes exactly on narration + 400ms:
  #        duration = (init + 620) + 2*sum(D[0..n-2]) + D[n-1]
  #
  # THE SCENE SCROLLS EXACTLY ONCE, AND NEVER AGAIN. An earlier version padded
  # each clip to length with a run of 45px pans after the last highlight. That
  # satisfied the drift gate while scrolling the subject clean out of the frame —
  # s32 lost the HITL block off the top edge 4s into a 27.5s scene and spent the
  # remaining 23s creeping over Spec-First, TDD and ADR content while the voice
  # was still on HITL. Deck-wide an overlay was on screen only 20.4% of the time
  # and 7,470px of pan went nowhere. Neither gate could see it: checkSceneSync
  # only compares durations, and the pans actively SUPPRESSED freezedetect.
  # Never pad a capture with motion — hold a highlight instead.
  #
  # Beats alternate between the concept's heading and its description so the
  # frame keeps changing without the page moving, and each beat is capped at 5s
  # so no static stretch reaches freezedetect's 6s window. Where the narration
  # names a <strong> sub-label, that beat is pinned to the term's own SRT cue
  # start, so the emphasis lands on the word as it is spoken (15 such beats,
  # all verified to overlap their cue).
  #
  # Change a narration and that scene's beats must be re-solved, or its
  # scene-drift FAIL returns.
  #
  # Two selector traps, both hit in earlier versions:
  #   * `highlight` draws a position:fixed overlay at the element's viewport box
  #     and does NOT scroll it into view, so every target must already be in
  #     frame. Targets are scoped to the concept rather than a loose `text:`,
  #     because resolveTarget uses getByText(...).first() and an earlier DOM
  #     match silently wins — four scenes were painting their overlay thousands
  #     of pixels off-screen while their `visible` asserts still passed.
  #   * sub-labels use `strong:has-text(...)`, NOT `:text-is(...)`. Playwright's
  #     text engines match only IMMEDIATE text, and several of these terms wrap
  #     their text in an <a>, so `:text-is` silently matches nothing.
  voice: { provider: kokoro, gender: female }
  baseUrl: http://127.0.0.1:4173

entries:
  # ── Cold open ──────────────────────────────────────────────────────────
  # S01 · statement · situation — plan §5 (Cold open) + §6 narration
  - id: s01-cold-open-confident
    type: slide
    role: situation
    layout: statement
    title: It was confident. It was also wrong.
    narration: >-
      You gave an agent a clear instruction. It produced something confident,
      complete, and wrong. Not broken code that failed loudly. Working code that
      solved the wrong problem.

  # S02 · tiled · complication — 3 cards, no stat (rule 5 N/A here).
  # SCR role reassigned during assembly: the archetype invariant caps `situation`
  # at 2 and requires >=1 complication and >=2 resolution beats. S02 is the
  # problem deepening (the three failure modes), so it is the complication beat.
  - id: s02-three-failures
    type: slide
    role: complication
    layout: tiled
    title: Three ways AI coding fails
    cards:
      - { icon: circle-help, title: Ambiguity, text: The requirement had two readings and nobody chose one. }
      - { icon: git-branch, title: Intent drift, text: The code stopped matching what was asked for. }
      - { icon: package, title: Handoff quality, text: The next step inherited something it could not use. }
    # The archetype requires a complication to name a cost. It is named in the
    # narration rather than in a card: lengthening one card would make it the
    # longest of three, and `tiled` asserts its cards are peers — an unequal
    # text weight there is a false claim, and it trips the dominance advisor.
    narration: >-
      AI coding fails in three ways, and none of them are about the model being
      weak. The requirement was ambiguous and the agent guessed. The code
      drifted from the intent while everyone watched. Or the handoff to the next
      step carried something unusable. Every one of them costs you the same
      thing: hours spent doing the work twice.

  # S03 · hero · 0 cards, pill: Prerequisites — section opener, carries no SCR
  # role (role removed during assembly so the S->C->R skeleton stays valid:
  # 1 situation, 1 complication, 2 resolution).
  - id: s03-hero
    type: slide
    layout: hero
    pill: Prerequisites
    title: LLM and Agent Foundations
    narration: >-
      This is Track B of the prerequisites: the large language model and agent
      concepts underneath the workflow. Four topics. The goal is not to use the
      workflow. It is to understand why each part of it is shaped the way it is.

  # S04 · capture · establishing scene — plan §6
  - id: s04-page-establishing
    type: capture
    url: /index.html
    setupScript: setup/capture-determinism.mjs
    steps:
      - { action: waitForText, value: 'Foundations of Agentic Engineering' }
      - { action: wait, delayMs: 2000 }
      - { action: scroll, delta: 2916, delayMs: 600 }
      - { action: highlight, text: 'Four topics that give you the foundation', delayMs: 5838 }
    assert:
      visible: ["Foundations of Agentic Engineering", "basis for the customisations taught in Lessons 1 and 2"]
      notVisible: ["Something went wrong"]
    # Narration compressed: the Track A / Track B split is legible on screen, and
    # two consecutive orientation scenes after a hot open spend the first 30s —
    # the one span with real retention evidence behind it. Ends on a seam into
    # Topic 1 (signalling).
    narration: >-
      Everything here lives on one page, as four topics, so you can follow along
      and come back to it. We start with how the models actually work.

  # ══ Topic 1 · How LLMs Actually Work — scenes S05–S12 ══
  # Three concepts (Context Windows, Memory Architecture, Hallucination),
  # two diagram slides interleaved (D1 stat-deepdive, D2 spotlight).

  # 1.1 Context Windows, Smart Zone / Dumb Zone, Lost in the Middle

  # S05 · capture · anchor + mechanism — carries chapter card (plan §7).
  - id: s05-context-windows-anchor
    type: capture
    overlay: chapter
    title: Topic 1
    chapterDescription: How LLMs Actually Work
    url: /index.html#phase-llms
    setupScript: setup/capture-determinism.mjs
    steps:
      - { action: scroll, delta: -344, delayMs: 600 }
      - { action: highlight, selector: '.concept-name:text-is("Context Windows, Smart Zone / Dumb Zone, and Lost in the Middle")', delayMs: 3009 }
      - { action: highlight, selector: '.concept:has(.concept-name:text-is("Context Windows, Smart Zone / Dumb Zone, and Lost in the Middle")) .concept-desc', delayMs: 3009 }
      - { action: highlight, selector: '.concept:has(.concept-name:text-is("Context Windows, Smart Zone / Dumb Zone, and Lost in the Middle")) strong:has-text("Dumb Zone")', delayMs: 5000 }
      - { action: highlight, selector: '.concept-name:text-is("Context Windows, Smart Zone / Dumb Zone, and Lost in the Middle")', delayMs: 3437 }
    assert:
      visible: ["How LLMs Actually Work", "Smart Zone"]
    narration: >-
      The context window is everything the model can see in one call: your prompt, the instructions, the code, the conversation so far. The page makes two claims about it. Models perform reliably up to roughly forty percent of their context limit — the Smart Zone. Past that they enter the Dumb Zone, where reasoning quality degrades. And within any window, content buried in the middle is recalled less accurately than content at the start or end. That is the Lost in the Middle effect.

  # S06 · slide · D1 stat-deepdive
  - id: s06-window-budget-slide
    type: slide
    layout: stat-deepdive
    title: The window is a budget
    stat: { value: '40', unit: '%', label: 'of the limit before reasoning degrades' }
    cards:
      - { icon: gauge, title: Smart Zone, text: Reasoning stays reliable here. }
      - { icon: trending-down, title: Dumb Zone, text: "Past the boundary, reasoning quality degrades." }
      - { icon: search, title: Lost in the middle, text: Content buried mid-window is recalled least accurately. }
    # Narration carries the RELATIONSHIP between the cards (volume vs position)
    # and the consequence. It deliberately does not re-read the three card
    # titles, which the screen already carries.
    narration: >-
      One picture, two different problems. One is about how much you load. The other is about where you put it. So a window can sit comfortably inside the Smart Zone and still lose a fact you buried halfway down.

  # S07 · capture · failure + practice
  - id: s07-context-windows-practice
    type: capture
    url: /index.html#phase-llms
    setupScript: setup/capture-determinism.mjs
    roiSelector: '.concept:has-text("Smart Zone")'
    steps:
      - { action: scroll, delta: -344, delayMs: 600 }
      - { action: highlight, selector: '.concept-name:text-is("Context Windows, Smart Zone / Dumb Zone, and Lost in the Middle")', delayMs: 4128 }
      - { action: highlight, selector: '.concept:has(.concept-name:text-is("Context Windows, Smart Zone / Dumb Zone, and Lost in the Middle")) .concept-desc', delayMs: 4128 }
      - { action: highlight, selector: '.concept-name:text-is("Context Windows, Smart Zone / Dumb Zone, and Lost in the Middle")', delayMs: 4126 }
    assert:
      visible: ["Dumb Zone", "Lost in the Middle"]
    narration: >-
      You have felt this. An hour into a session the agent starts ignoring instructions it followed perfectly at the start. Nothing broke; the window filled. So two habits follow. Put critical instructions at the top, where attention is strongest. And when quality starts slipping, do not argue with the agent — start a fresh session and carry only what matters.

  # 1.2 LLM Memory Architecture

  # S08 · capture · anchor + mechanism
  - id: s08-memory-anchor
    type: capture
    url: /index.html#phase-llms
    setupScript: setup/capture-determinism.mjs
    steps:
      - { action: scroll, delta: -213, delayMs: 600 }
      - { action: highlight, selector: '.concept-name:text-is("LLM Memory Architecture")', delayMs: 4773 }
      - { action: highlight, selector: '.concept:has(.concept-name:text-is("LLM Memory Architecture")) .concept-desc', delayMs: 4773 }
      - { action: highlight, selector: '.concept-name:text-is("LLM Memory Architecture")', delayMs: 4771 }
    assert:
      visible: ["LLM Memory Architecture", "parametric"]
    narration: >-
      Large language models have no persistent state between calls. There are three stores. In-context is the current prompt and conversation — ephemeral, lost between calls. External is durable: files, version control, issue trackers, artifacts that survive sessions. Parametric is the trained weights, fixed and unchangeable. The workflow relies on external memory as its durable backbone.

  # S09 · slide · D2 spotlight — External FIRST (dominant slot is positional, rule 8).
  - id: s09-memory-stores-slide
    type: slide
    layout: spotlight
    title: Three stores, three lifetimes
    cards:
      # `weight: primary` states the rank outright. Without it the advisor ranks
      # by text length — which External happens to win, so the dominant slot was
      # right only by luck. Text length measures overflow risk, not importance.
      - { icon: git-branch, title: External, weight: primary, text: "Files, version control and issue trackers. Survives every session." }
      - { icon: message-square, title: In-context, text: The current prompt and conversation. Gone after the call. }
      - { icon: cpu, title: Parametric, text: Trained weights. Fixed and unchangeable. }
    narration: >-
      Rank these by lifetime and the design falls out on its own. Weights you cannot change. Conversation you cannot keep. Which leaves exactly one place to put a decision you need honoured next week: the repository.

  # S10 · capture · failure + practice
  - id: s10-memory-practice
    type: capture
    url: /index.html#phase-llms
    setupScript: setup/capture-determinism.mjs
    roiSelector: '.concept:has-text("LLM Memory Architecture")'
    steps:
      - { action: scroll, delta: -213, delayMs: 600 }
      - { action: highlight, selector: '.concept-name:text-is("LLM Memory Architecture")', delayMs: 3603 }
      - { action: highlight, selector: '.concept:has(.concept-name:text-is("LLM Memory Architecture")) .concept-desc', delayMs: 3603 }
      - { action: highlight, selector: '.concept-name:text-is("LLM Memory Architecture")', delayMs: 3601 }
    assert:
      visible: ["in-context", "external"]
    narration: >-
      This is why a decision explained in chat is a decision you will explain again. Tomorrow's session starts blank, and the reasoning is gone. The practice: anything a future session must respect gets written to a file and committed. If it only exists in a conversation, treat it as already lost.

  # 1.3 Hallucination and Non-determinism

  # S11 · capture · anchor + mechanism
  - id: s11-hallucination-anchor
    type: capture
    url: /index.html#phase-llms
    setupScript: setup/capture-determinism.mjs
    steps:
      - { action: scroll, delta: -72, delayMs: 600 }
      - { action: highlight, selector: '.concept:has(.concept-name:text-is("Hallucination and Non-determinism")) strong:has-text("Hallucination")', delayMs: 5000 }
      - { action: highlight, selector: '.concept-name:text-is("Hallucination and Non-determinism")', delayMs: 4569 }
      - { action: highlight, selector: '.concept:has(.concept-name:text-is("Hallucination and Non-determinism")) strong:has-text("Non-determinism")', delayMs: 4950 }
    assert:
      visible: ["Hallucination", "Non-determinism"]
    narration: >-
      Two distinct problems. Hallucination: models predict the most likely next token rather than verify facts, so they generate plausible, incorrect information with full confidence. The page is precise about this — it is a generation problem, not a placement problem. No amount of Smart Zone positioning prevents it. Non-determinism: identical inputs produce different outputs across runs.

  # S12 · capture · failure + practice + misconception
  - id: s12-hallucination-practice
    type: capture
    url: /index.html#phase-llms
    setupScript: setup/capture-determinism.mjs
    roiSelector: '.concept:has-text("Hallucination")'
    steps:
      - { action: scroll, delta: -72, delayMs: 600 }
      - { action: highlight, selector: '.concept-name:text-is("Hallucination and Non-determinism")', delayMs: 4798 }
      - { action: highlight, selector: '.concept:has(.concept-name:text-is("Hallucination and Non-determinism")) .concept-desc', delayMs: 4798 }
      - { action: highlight, selector: '.concept-name:text-is("Hallucination and Non-determinism")', delayMs: 4796 }
    assert:
      visible: ["human review", "convergence signal"]
    narration: >-
      Note the misconception this kills. Better placement fixes attention, not truthfulness. A perfectly positioned reference document does not stop a confident invention. The safeguards are human review and automated tests. And because the same prompt can give you a different answer next run, "it looks right" is not evidence. Machine-verifiable tests are the only reliable convergence signal.

  # ══ Topic 2 · Agentic Engineering — scenes S13–S31 ══
  # 19 entries in page order: 16 captures + 3 diagram slides interleaved.

  # --- 2.1 Prompt Engineering ---
  # S13 · anchor + mechanism — carries the Topic 2 chapter card.
  - id: s13-prompt-engineering-anchor
    type: capture
    url: /index.html#phase-engineering
    overlay: chapter
    title: Topic 2
    chapterDescription: Agentic Engineering
    setupScript: setup/capture-determinism.mjs
    steps:
      - { action: scroll, delta: -343, delayMs: 600 }
      - { action: highlight, selector: '.concept-name:text-is("Prompt Engineering")', delayMs: 3034 }
      - { action: highlight, selector: '.concept:has(.concept-name:text-is("Prompt Engineering")) strong:has-text("role framing")', delayMs: 1836 }
      - { action: highlight, selector: '.concept:has(.concept-name:text-is("Prompt Engineering")) strong:has-text("positive framing")', delayMs: 4787 }
      - { action: highlight, selector: '.concept:has(.concept-name:text-is("Prompt Engineering")) strong:has-text("chain-of-thought elicitation")', delayMs: 1967 }
      - { action: highlight, selector: '.concept:has(.concept-name:text-is("Prompt Engineering")) strong:has-text("explicit completion criteria")', delayMs: 3575 }
    assert:
      visible: ["Agentic Engineering", "Prompt Engineering", "role framing"]
    # Opens with a spoken seam into Topic 2. The `overlay: chapter` card carries
    # the transition visually, but the audio track previously jumped cold.
    narration: >-
      Those are the limits. Now the engineering that works within them. Prompt
      engineering is writing clear instructions for a single call. Four
      techniques. Role framing sets the agent's expertise and perspective.
      Positive framing describes the target behaviour rather than what to avoid —
      because the model predicts tokens toward whatever pattern you surface.
      Chain-of-thought elicitation asks it to reason step by step. And explicit
      completion criteria define what done means.

  # S14 · failure + practice
  - id: s14-prompt-engineering-practice
    type: capture
    url: /index.html#phase-engineering
    setupScript: setup/capture-determinism.mjs
    roiSelector: '.concept:has-text("Prompt Engineering")'
    steps:
      - { action: scroll, delta: -343, delayMs: 600 }
      - { action: highlight, selector: '.concept-name:text-is("Prompt Engineering")', delayMs: 2975 }
      - { action: highlight, selector: '.concept:has(.concept-name:text-is("Prompt Engineering")) .concept-desc', delayMs: 2975 }
      - { action: highlight, selector: '.concept:has(.concept-name:text-is("Prompt Engineering")) strong:has-text("explicit completion criteria")', delayMs: 6613 }
    assert:
      visible: ["chain-of-thought", "completion criteria"]
    narration: >-
      Positive framing is the one that feels wrong and matters most. "Never use
      `any`" puts `any` in front of the model. "Always write typed interfaces"
      gives it a target. Write what you want, not what you fear. And state
      completion criteria explicitly, because an agent with no definition of done
      will invent one.

  # --- 2.2 Context Engineering ---
  # S15 · anchor + mechanism
  - id: s15-context-engineering-anchor
    type: capture
    url: /index.html#phase-engineering
    setupScript: setup/capture-determinism.mjs
    steps:
      - { action: scroll, delta: -223, delayMs: 600 }
      - { action: highlight, selector: '.concept-name:text-is("Context Engineering")', delayMs: 3762 }
      - { action: highlight, selector: '.concept:has(.concept-name:text-is("Context Engineering")) strong:has-text("Context rot")', delayMs: 5000 }
      - { action: highlight, selector: '.concept:has(.concept-name:text-is("Context Engineering")) .concept-desc', delayMs: 1671 }
      - { action: highlight, selector: '.concept-name:text-is("Context Engineering")', delayMs: 1672 }
    assert:
      visible: ["Context Engineering", "Context rot"]
    narration: >-
      Prompt engineering is about how you phrase instructions. Context engineering
      is about what information is in the window at every step. The failure mode
      has a name: context rot, the silent degradation of recall as the window
      fills — before it is full. The design principle is one line. Pre-load only
      what is always needed, and retrieve everything else just-in-time.

  # S16 · failure + practice
  - id: s16-context-engineering-practice
    type: capture
    url: /index.html#phase-engineering
    setupScript: setup/capture-determinism.mjs
    roiSelector: '.concept:has-text("Context rot")'
    steps:
      - { action: scroll, delta: -223, delayMs: 600 }
      - { action: highlight, selector: '.concept-name:text-is("Context Engineering")', delayMs: 3703 }
      - { action: highlight, selector: '.concept:has(.concept-name:text-is("Context Engineering")) .concept-desc', delayMs: 3703 }
      - { action: highlight, selector: '.concept-name:text-is("Context Engineering")', delayMs: 3701 }
    assert:
      visible: ["pre-load", "just-in-time"]
    narration: >-
      The tempting move is to load every framework guide and coding standard up
      front so the agent always has them. That spends the capacity the task needs,
      and degrades recall across everything else in the window. Silently — there
      is no warning. Load what is always needed. Fetch the rest when it is needed.

  # --- 2.3 Retrieval-Augmented Generation ---
  # S17 · anchor + mechanism
  - id: s17-rag-anchor
    type: capture
    url: /index.html#phase-engineering
    setupScript: setup/capture-determinism.mjs
    steps:
      - { action: scroll, delta: -103, delayMs: 600 }
      - { action: highlight, selector: '.concept-name:text-is("Retrieval-Augmented Generation (RAG)")', delayMs: 3828 }
      - { action: highlight, selector: '.concept:has(.concept-name:text-is("Retrieval-Augmented Generation (RAG)")) .concept-desc', delayMs: 3828 }
      - { action: highlight, selector: '.concept-name:text-is("Retrieval-Augmented Generation (RAG)")', delayMs: 3826 }
    assert:
      visible: ["Retrieval-Augmented Generation", "chunked"]
    narration: >-
      Retrieval-augmented generation, RAG, is the mechanism behind just-in-time
      retrieval. Source documents are chunked, indexed, and searched on each
      request — semantic, keyword, or hybrid. The most relevant chunks get
      injected into the window at the moment they are needed, instead of
      everything being pre-loaded.

  # S18 · failure + practice
  - id: s18-rag-practice
    type: capture
    url: /index.html#phase-engineering
    setupScript: setup/capture-determinism.mjs
    roiSelector: '.concept:has-text("Retrieval-Augmented Generation")'
    steps:
      - { action: scroll, delta: -103, delayMs: 600 }
      - { action: highlight, selector: '.concept-name:text-is("Retrieval-Augmented Generation (RAG)")', delayMs: 4463 }
      - { action: highlight, selector: '.concept:has(.concept-name:text-is("Retrieval-Augmented Generation (RAG)")) .concept-desc', delayMs: 4462 }
    assert:
      visible: ["semantic", "hybrid"]
    narration: >-
      This is the difference between a reference library and a stack of books on
      your desk. You are not reading less; you are holding less at once. In
      practice: when a knowledge base exists, query it. Pasting the document in
      defeats the point.

  # --- 2.4 Open Knowledge Format ---
  # S19 · anchor + mechanism
  - id: s19-okf-anchor
    type: capture
    url: /index.html#phase-engineering
    setupScript: setup/capture-determinism.mjs
    steps:
      - { action: scroll, delta: 38, delayMs: 600 }
      - { action: highlight, selector: '.concept-name:text-is("Open Knowledge Format (OKF)")', delayMs: 3770 }
      - { action: highlight, selector: '.concept:has(.concept-name:text-is("Open Knowledge Format (OKF)")) .concept-desc', delayMs: 3770 }
      - { action: highlight, selector: '.concept-name:text-is("Open Knowledge Format (OKF)")', delayMs: 3770 }
      - { action: highlight, selector: '.concept:has(.concept-name:text-is("Open Knowledge Format (OKF)")) .concept-desc', delayMs: 3768 }
    assert:
      visible: ["Open Knowledge Format", "typed entities"]
    narration: >-
      Open Knowledge Format is a structured knowledge representation that makes
      retrieval more precise than raw document chunks. Andrej Karpathy argued that
      conventional RAG retrieves noisy, unstructured text fragments. Hybrid search
      helps you find the right chunk, but the chunk itself may still carry
      irrelevant surrounding text. OKF addresses that at the representation level,
      organising knowledge as typed entities and relationships.

  # S20 · failure + practice
  - id: s20-okf-practice
    type: capture
    url: /index.html#phase-engineering
    setupScript: setup/capture-determinism.mjs
    roiSelector: '.concept:has-text("Open Knowledge Format")'
    steps:
      - { action: scroll, delta: 38, delayMs: 600 }
      - { action: highlight, selector: '.concept-name:text-is("Open Knowledge Format (OKF)")', delayMs: 3679 }
      - { action: highlight, selector: '.concept:has(.concept-name:text-is("Open Knowledge Format (OKF)")) .concept-desc', delayMs: 3680 }
    assert:
      visible: ["typed entities", "specific fact"]
    narration: >-
      The shift is in the unit of retrieval. With chunks you get a paragraph and
      hope the fact is in it. With structured knowledge you get the fact. Same
      search, less noise arriving with the answer.

  # --- 2.5 Model Context Protocol ---
  # S21 · anchor + mechanism
  - id: s21-mcp-anchor
    type: capture
    url: /index.html#phase-engineering
    setupScript: setup/capture-determinism.mjs
    steps:
      - { action: scroll, delta: 169, delayMs: 600 }
      - { action: highlight, selector: '.concept-name:text-is("Model Context Protocol (MCP)")', delayMs: 4383 }
      - { action: highlight, selector: '.concept:has(.concept-name:text-is("Model Context Protocol (MCP)")) .concept-desc', delayMs: 4383 }
      - { action: highlight, selector: '.concept-name:text-is("Model Context Protocol (MCP)")', delayMs: 4381 }
    assert:
      visible: ["Model Context Protocol", "external tools"]
    narration: >-
      Model Context Protocol, MCP, is an open protocol for connecting models to
      external tools, data sources and services. Where RAG retrieves from a
      pre-indexed snapshot, MCP lets the agent query a tool's current state —
      reading file systems, calling APIs, querying databases — without custom
      integration per tool.

  # S22 · slide · D4 comparison (exactly 2 cards)
  - id: s22-rag-vs-mcp-slide
    type: slide
    layout: comparison
    title: Retrieve, or act
    cards:
      - { icon: database, title: RAG, text: Retrieval before generation. Fetches information to ground the answer. }
      - { icon: plug, title: MCP, text: A protocol for reaching tools. It reads systems and can act on them. }
    # Narration reduced to the single load-bearing contrast. Both cards already
    # state their own mechanism on screen, so re-explaining each one in the voice
    # is the harmful redundancy case AND pushed this scene past twice the
    # 12-18s comparison budget. The voice now carries only what the cards cannot:
    # which of the two distinctions is the real one.
    narration: >-
      It is tempting to think the line is freshness. It is not — RAG can query a
      live database just as easily as a document store. The real line is purpose.
      Retrieval grounds an answer; a transaction has a consequence. They are not
      competitors, and knowing which one you need is the whole decision.

