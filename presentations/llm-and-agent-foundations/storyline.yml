    narration: >-
      So ask two questions of whatever the agent needs. Does it need to know
      something? That is retrieval, and RAG covers it whether the source is a
      document store or a live database. Does it need to change something outside
      itself? That is a transaction, and no amount of retrieval will do it.
      Knowing which of the two you need is the whole decision.

  # --- 2.6 The ReAct Pattern and Agentic Loop Design ---
  # S24 · anchor + mechanism
  - id: s24-react-anchor
    type: capture
    url: /index.html#phase-engineering
    setupScript: setup/capture-determinism.mjs
    steps:
      - { action: scroll, delta: 309, delayMs: 600 }
      - { action: highlight, selector: '.concept-name:text-is("The ReAct Pattern and Agentic Loop Design")', delayMs: 2232 }
      - { action: highlight, selector: '.concept:has(.concept-name:text-is("The ReAct Pattern and Agentic Loop Design")) strong:has-text("Act")', delayMs: 2456 }
      - { action: highlight, selector: '.concept:has(.concept-name:text-is("The ReAct Pattern and Agentic Loop Design")) strong:has-text("Observe")', delayMs: 5000 }
      - { action: highlight, selector: '.concept:has(.concept-name:text-is("The ReAct Pattern and Agentic Loop Design")) .concept-desc', delayMs: 913 }
      - { action: highlight, selector: '.concept:has(.concept-name:text-is("The ReAct Pattern and Agentic Loop Design")) strong:has-text("convergence condition")', delayMs: 4386 }
    assert:
      visible: ["ReAct Pattern", "convergence condition"]
    narration: >-
      This is the pattern that turns a single-shot model into a multi-step agent.
      Three phases. Reason: decide what to do next. Act: call a tool, write code,
      run a command. Observe: read the result and feed it into the next reasoning
      step. That observe-then-reason cycle is what lets an agent self-correct from
      real outcomes instead of guessing in one pass. And every loop needs a
      convergence condition telling it when to stop.

  # S25 · slide · D3 cycle (3 recurring stages)
  # Shape is a claim. `lifecycle` draws a straight rail, which asserts a
  # terminus — but ReAct RECURS, and this scene's whole point is what each lap
  # costs. A loop drawn on a rail is a false statement about the content, so
  # this is `cycle`, whose return connector carries the recurrence.
  # `cycle` is reachable ONLY via the explicit `cycle: true` marker: a loop is a
  # claim card shape cannot reveal, so it is never inferred. Without the marker
  # the four detailed cards route to `lifecycle` via the allDetailed rule, which
  # is exactly how this slide ended up on a rail.
  # Exit is dropped as a ring node: it is the loop's guard, not a phase passed
  # through each lap. Putting it in the ring implies you exit every lap. The exit
  # condition now lives in the title, and S24/S26 both cover convergence.
  - id: s25-react-loop-slide
    type: slide
    layout: cycle
    cycle: true
    title: The loop repeats until a signal says stop
    cards:
      - { icon: brain, title: Reason, detail: Phase 1, text: Decide what to do next. }
      - { icon: play, title: Act, detail: Phase 2, text: "Call a tool, write code, run a command." }
      - { icon: eye, title: Observe, detail: Phase 3, text: Read the result and feed it back. }
    narration: >-
      Reason, act, observe — and then the observation joins the window and the
      lap starts again. Without a stop signal that does two things at once: it
      never ends, and each lap degrades the one before it. By lap fifteen the
      agent is reasoning mostly over its own history.

